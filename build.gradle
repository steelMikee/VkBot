plugins {
    id 'java'
}

group = 'ru.github.vacancybot'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.vk.api:sdk:1.0.16'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'

    implementation("com.google.code.gson:gson:2.14.0")

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    implementation 'org.slf4j:slf4j-simple:2.0.13'


    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'org.wiremock:wiremock:3.9.2'

    compileOnly 'org.jetbrains:annotations:26.0.1'

    testCompileOnly 'org.jetbrains:annotations:26.0.1'
}

jar {
    manifest {
        attributes 'Main-Class': 'ru.github.vacancybot.Main'
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


test {
    useJUnitPlatform {
        excludeTags 'live-network'
    }
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }

    testLogging.showStandardStreams = true

    def envFile = file("${rootDir}/.env")
    def backupFile = file("${rootDir}/.env.backup")

    doFirst {
        if (envFile.exists()) {
            envFile.renameTo(backupFile)
        }
    }

    doLast {
        if (backupFile.exists()) {
            backupFile.renameTo(envFile)
        }
    }

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}


tasks.register('liveTest', Test) {
    description = 'Live-тесты против реального API trudvsem.ru (требуют интернет)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live-network'
    }
    shouldRunAfter test
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}



